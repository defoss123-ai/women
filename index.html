<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Women's Success Map | UA/EN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      --bg: #f7f5fa;
      --panel: #ffffff;
      --text: #302a37;
      --muted: #6c6578;
      --accent: #b589c9;
      --accent-strong: #834e9f;
      --border: #ede6f5;
      --shadow: 0 16px 38px rgba(65, 39, 83, 0.12);
      --rose-gold: #c79b76;
      --rose-gold-deep: #a8734f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Montserrat", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, #f3ebfb 0%, var(--bg) 42%, #faf8fd 100%);
      min-height: 100vh;
    }

    .page {
      width: min(1280px, calc(100% - 1.2rem));
      margin: 0 auto;
      padding: 1rem 0 1.1rem;
    }

    header {
      display: grid;
      gap: 0.8rem;
      margin-bottom: 0.9rem;
    }

    .top-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      justify-content: space-between;
      align-items: center;
    }

    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      padding: 0.18rem;
      box-shadow: 0 8px 20px rgba(80, 45, 101, 0.08);
    }

    .lang-btn {
      border: none;
      background: transparent;
      border-radius: 999px;
      padding: 0.42rem 0.8rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--muted);
    }

    .lang-btn.active {
      color: #fff;
      background: linear-gradient(135deg, #ab7cc2, #8757a1);
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.36rem 0.5rem 0.36rem 0.8rem;
      min-width: min(100%, 430px);
      flex: 1;
      box-shadow: 0 8px 22px rgba(67, 39, 84, 0.08);
    }

    #searchInput {
      border: none;
      outline: none;
      width: 100%;
      font-size: 0.95rem;
      background: transparent;
      color: #453d50;
    }

    #searchBtn {
      border: none;
      border-radius: 999px;
      background: #f0e5f7;
      color: #633f77;
      font-weight: 600;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
    }

    h1 {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(1.45rem, 3vw, 2.25rem);
      color: #4f345f;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      max-width: 920px;
      line-height: 1.55;
      font-size: 0.95rem;
    }

    .layout {
      display: grid;
      gap: 0.95rem;
      grid-template-columns: 1.32fr 0.88fr;
      min-height: 72vh;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 0;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 490px;
    }

    .panel {
      padding: 1.05rem;
      display: grid;
      gap: 0.8rem;
      overflow-y: auto;
      max-height: 75vh;
    }

    .badge {
      display: inline-flex;
      width: fit-content;
      border-radius: 999px;
      background: #f2e8f9;
      color: #70448a;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 0.34rem 0.8rem;
    }

    .name {
      margin: 0;
      font-family: "Playfair Display", serif;
      color: #3d2948;
      line-height: 1.25;
      font-size: 1.7rem;
    }

    .story, .quote {
      margin: 0;
      line-height: 1.58;
      color: #453f4f;
      font-size: 0.95rem;
    }

    .quote {
      font-style: italic;
      border-left: 4px solid #c59ad8;
      background: #f8f2fc;
      border-radius: 10px;
      padding: 0.7rem 0.8rem;
    }

    .vocab-title {
      margin: 0;
      color: #523063;
      font-size: 1rem;
    }

    .vocab-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.56rem;
    }

    .vocab-list li {
      border: 1px solid #ecdeF4;
      border-radius: 10px;
      padding: 0.6rem 0.7rem;
      background: #fcfafe;
      line-height: 1.45;
      font-size: 0.9rem;
    }

    .word { font-weight: 700; color: #684180; }
    .translation { color: #8a689c; font-weight: 600; }

    .leaflet-popup-content-wrapper {
      border: 1px solid #eadcf4;
      border-radius: 13px;
    }

    .country-geo {
      color: #8757a1;
      font-weight: 600;
    }

    @media (max-width: 1000px) {
      .layout { grid-template-columns: 1fr; }
      .panel { max-height: unset; }
      #map { min-height: 430px; }
    }
  </style>
</head>
<body>

        story: {
          en: "Kate Sheppard led the movement that helped New Zealand become the first self-governing country to grant women the vote. She organized campaigns, wrote persuasive texts, and built civic momentum. Her work changed democratic history.",
          ua: "Кейт Шеппард очолила рух, завдяки якому Нова Зеландія стала першою самоврядною країною, що надала жінкам виборче право. Вона організовувала кампанії, писала переконливі тексти та створювала громадський імпульс. Її робота змінила демократичну історію."
        },
        quote: { en: "All that separates, whether race, class, creed, or sex, is inhuman.", ua: "Усе, що розділяє — раса, клас, віра чи стать — є нелюдяним." },
        vocab: [
          { en: "movement", ua: "рух", meaning: { en: "organized effort for change", ua: "організовані дії заради змін" } },
          { en: "grant", ua: "надавати", meaning: { en: "to officially give", ua: "офіційно надавати" } },
          { en: "campaign", ua: "кампанія", meaning: { en: "planned actions for a goal", ua: "план дій для досягнення мети" } },
          { en: "persuasive", ua: "переконливий", meaning: { en: "able to convince others", ua: "здатний переконувати" } },
          { en: "civic", ua: "громадянський", meaning: { en: "related to citizens and society", ua: "пов'язаний з громадянами та суспільством" } }
        ]
      }
    };

    // Island countries highlighted with rose-gold markers for visibility.
    const islandCountries = [
      "Iceland", "Ireland", "United Kingdom", "Japan", "Philippines", "Indonesia", "Sri Lanka", "Madagascar",
      "New Zealand", "Cuba", "Jamaica", "Haiti", "Dominican Republic", "Bahamas", "Barbados", "Fiji",
      "Samoa", "Tonga", "Papua New Guinea", "Solomon Islands", "Vanuatu", "Mauritius", "Malta", "Cyprus"
    ];

    const map = L.map("map", { worldCopyJump: true }).setView([21, 8], 2.2);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
      subdomains: "abcd",
      maxZoom: 19
    }).addTo(map);

    let currentLang = "en";
    let countryLayer;
    const countryIndex = new Map();
    const panel = document.getElementById("detailsPanel");
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");

    function normalizeName(name) {
      return (name || "").toLowerCase().replace(/[^a-zа-яіїє'\-\s]/gi, "").trim();
    }

    function resolveProfile(countryName) {
      if (womenByCountry[countryName]) return womenByCountry[countryName];
      for (const [key, value] of Object.entries(womenByCountry)) {
        if ((value.aliases || []).some(a => normalizeName(a) === normalizeName(countryName))) {
          return value;
        }
      }
      return {
        woman: { en: I18N.en.templateName, ua: I18N.ua.templateName },
        story: { en: I18N.en.templateStory, ua: I18N.ua.templateStory },
        quote: { en: I18N.en.templateQuote, ua: I18N.ua.templateQuote },
        vocab: [
          { en: "word 1", ua: "слово 1", meaning: { en: "add contextual meaning", ua: "додайте контекстне значення" } },
          { en: "word 2", ua: "слово 2", meaning: { en: "add contextual meaning", ua: "додайте контекстне значення" } },
          { en: "word 3", ua: "слово 3", meaning: { en: "add contextual meaning", ua: "додайте контекстне значення" } },
          { en: "word 4", ua: "слово 4", meaning: { en: "add contextual meaning", ua: "додайте контекстне значення" } },
          { en: "word 5", ua: "слово 5", meaning: { en: "add contextual meaning", ua: "додайте контекстне значення" } }
        ],
        template: true
      };
    }

    function setStaticText() {
      const t = I18N[currentLang];
      document.documentElement.lang = currentLang;
      document.getElementById("title").textContent = t.pageTitle;
      document.getElementById("subtitle").textContent = t.subtitle;
      searchInput.placeholder = t.searchPlaceholder;
      searchBtn.textContent = t.searchBtn;
      if (!panel.dataset.activeCountry) {
        panel.innerHTML = `<h2 style="margin:0">${t.chooseCountry}</h2><p style="margin:0;color:#6c6578;line-height:1.5">${t.chooseHint}</p>`;
      }
      document.getElementById("langEN").classList.toggle("active", currentLang === "en");
      document.getElementById("langUA").classList.toggle("active", currentLang === "ua");
    }

    function renderPanel(countryName) {
      const t = I18N[currentLang];
      const p = resolveProfile(countryName);
      panel.dataset.activeCountry = countryName;
      panel.innerHTML = `
        <span class="badge">${p.template ? t.templateBadge : countryName}</span>
        <h2 class="name">${p.woman[currentLang]}</h2>
        <p class="story">${p.story[currentLang]}</p>
        <p class="quote">“${p.quote[currentLang]}”</p>
        <h3 class="vocab-title">${t.vocabularyBoost}</h3>
        <ul class="vocab-list">
          ${p.vocab.map(v => `<li><span class="word">${v.en}</span> <span class="translation">(${v.ua})</span><br>${v.meaning[currentLang]}</li>`).join("")}
        </ul>
      `;
    }

    function zoomToCountry(featureName) {
      const layer = countryIndex.get(normalizeName(featureName));
      if (!layer) return false;
      map.fitBounds(layer.getBounds(), { padding: [25, 25], maxZoom: 5 });
      layer.openPopup();
      renderPanel(featureName);
      return true;
    }

    function addIslandMarkers(geojson) {
      const t = I18N[currentLang];
      geojson.features.forEach(f => {
        const n = f.properties.ADMIN;
        if (!islandCountries.includes(n)) return;
        const center = L.geoJSON(f).getBounds().getCenter();
        L.circleMarker(center, {
          radius: 6,
          color: "#8d6041",
          weight: 2,
          fillColor: "#c79b76",
          fillOpacity: 0.95
        }).addTo(map).bindPopup(`<span class="country-geo">${n}</span><br>${t.islandLabel}`);
      });
    }

    async function initWorld() {
      const res = await fetch("https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson");
      const geojson = await res.json();

      countryLayer = L.geoJSON(geojson, {
        style: {
          color: "#ac96bc",
          weight: 1,
          fillColor: "#f6effc",
          fillOpacity: 0.72
        },
        onEachFeature: (feature, layer) => {
          const name = feature.properties.ADMIN;
          countryIndex.set(normalizeName(name), layer);
          layer.bindPopup(`<span class="country-geo">${name}</span><br>${I18N[currentLang].popupHint}`);
          layer.on("click", () => {
            renderPanel(name);
            map.fitBounds(layer.getBounds(), { padding: [22, 22], maxZoom: 5 });
          });
        }
      }).addTo(map);

      addIslandMarkers(geojson);
      setStaticText();
    }

    document.getElementById("langEN").addEventListener("click", () => {
      currentLang = "en";
      setStaticText();
      if (panel.dataset.activeCountry) renderPanel(panel.dataset.activeCountry);
    });

    document.getElementById("langUA").addEventListener("click", () => {
      currentLang = "ua";
      setStaticText();
      if (panel.dataset.activeCountry) renderPanel(panel.dataset.activeCountry);
    });

    function runSearch() {
      const q = searchInput.value.trim();
      if (!q) return;
      if (!zoomToCountry(q)) alert(I18N[currentLang].notFound);
    }

    searchBtn.addEventListener("click", runSearch);
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") runSearch();
    });

    initWorld().catch(err => {
      panel.innerHTML = `<p style="color:#8a344a"><strong>Error:</strong> ${err.message}</p>`;
    });
  </script>
</body>
</html>
