<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Women's Success Map | International Women's Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      --bg: #f7f6fb;
      --panel: #ffffff;
      --text: #2e2c34;
      --muted: #686377;
      --accent: #b68acb;
      --accent-deep: #8d5ea6;
      --border: #ece8f4;
      --shadow: 0 18px 40px rgba(71, 45, 92, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Montserrat", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, #f2ecfa 0%, var(--bg) 40%, #f9f8fc 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.3rem 1.5rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-weight: 700;
      font-size: clamp(1.65rem, 3.2vw, 2.35rem);
      color: #4f355f;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0.35rem auto 0;
      max-width: 820px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.55;
    }

    main {
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto 1.2rem;
      display: grid;
      grid-template-columns: 1.25fr 0.95fr;
      gap: 1rem;
      align-items: stretch;
      flex: 1;
      min-height: 0;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 0;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 430px;
      border-radius: 20px;
    }

    aside {
      padding: 1.25rem 1.25rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }

    .panel-title {
      margin: 0;
      font-size: 1.18rem;
      font-weight: 700;
      color: #51335f;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .country-badge {
      display: inline-flex;
      align-self: flex-start;
      background: #efe5f6;
      color: #6d4487;
      border-radius: 999px;
      padding: 0.32rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .name {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: 1.75rem;
      color: #3f2a4c;
      line-height: 1.25;
    }

    .story {
      margin: 0;
      color: #423c4f;
      line-height: 1.65;
      font-size: 0.97rem;
    }

    .quote {
      margin: 0;
      padding: 0.9rem 1rem;
      border-radius: 14px;
      background: #f6f0fa;
      color: #5a4568;
      font-style: italic;
      line-height: 1.55;
      border-left: 4px solid #c59bd8;
      font-size: 0.95rem;
    }

    .vocab-title {
      margin: 0;
      font-size: 1rem;
      color: #563565;
      font-weight: 700;
    }

    .vocab-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.65rem;
    }

    .vocab-list li {
      padding: 0.65rem 0.75rem;
      background: #fcfafd;
      border: 1px solid #ece2f4;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .vocab-word {
      font-weight: 700;
      color: #69427f;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      box-shadow: 0 14px 24px rgba(45, 23, 59, 0.25);
      border: 1px solid #ebdcf3;
    }

    .leaflet-popup-content {
      margin: 0.85rem 1rem;
      font-family: "Montserrat", sans-serif;
      color: #3b3342;
      min-width: 170px;
    }

    .mini-title {
      margin: 0 0 0.35rem;
      font-weight: 700;
      color: #5e3d73;
      font-size: 0.95rem;
    }

    .mini-text {
      margin: 0;
      font-size: 0.85rem;
      line-height: 1.45;
    }

    @media (max-width: 980px) {
      main {
        grid-template-columns: 1fr;
      }

      .card.map-card {
        min-height: 390px;
      }

      aside {
        max-height: unset;
      }
    }

    @media (max-width: 620px) {
      header {
        padding-inline: 1rem;
      }

      main {
        width: calc(100% - 1rem);
        gap: 0.75rem;
      }

      .card,
      #map {
        border-radius: 16px;
      }

      aside {
        padding: 1rem;
      }

      .name {
        font-size: 1.48rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Women's Success Map</h1>
    <p class="subtitle">Click a country marker to discover inspiring women leaders and boost your English with useful vocabulary.</p>
  </header>

  <main>
    <section class="card map-card" aria-label="Interactive map section">
      <div id="map"></div>
    </section>

    <section class="card" aria-label="Story details section">
      <aside id="detailsPanel">
        <h2 class="panel-title">Choose a country on the map</h2>
        <p class="hint">Explore 7 countries and learn from women who changed the world in science, activism, arts, and leadership.</p>
      </aside>
    </section>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const countryStories = [
      {
        country: "Ukraine",
        woman: "Kateryna Yushchenko",
        coords: [50.4501, 30.5234],
        story: "Kateryna Yushchenko was a pioneer in computer science and helped develop one of Europe's early high-level programming languages. She built practical systems that made coding easier for scientists and engineers. Her work opened doors for future Ukrainian women in technology.",
        quote: "Innovation grows when education and courage meet.",
        vocab: [
          ["Pioneer", "A person who is one of the first to develop or do something new."],
          ["Practical", "Useful in real situations, not only in theory."],
          ["Engineer", "A person who designs or builds machines, systems, or structures."],
          ["Develop", "To create or improve something over time."],
          ["Doors", "Opportunities or chances for progress."]
        ]
      },
      {
        country: "United States",
        woman: "Maya Angelou",
        coords: [38.9072, -77.0369],
        story: "Maya Angelou became an influential writer, poet, and civil rights voice. Through her autobiographies and speeches, she inspired people to overcome fear and speak with dignity. Her words continue to empower learners around the world.",
        quote: "You may not control all the events that happen to you, but you can decide not to be reduced by them.",
        vocab: [
          ["Influential", "Having the power to affect people or decisions."],
          ["Overcome", "To successfully deal with and defeat a problem."],
          ["Dignity", "Calm and respectful behavior that shows self-worth."],
          ["Empower", "To give someone confidence and strength."],
          ["Reduced", "Made smaller in importance, value, or quality."]
        ]
      },
      {
        country: "United Kingdom",
        woman: "Ada Lovelace",
        coords: [51.5072, -0.1276],
        story: "Ada Lovelace wrote the first algorithm intended for a machine in the 19th century. She imagined that computers could create music and art, not only calculate numbers. Her vision was far ahead of her time.",
        quote: "That brain of mine is something more than merely mortal.",
        vocab: [
          ["Algorithm", "A set of steps used to solve a problem."],
          ["Intended", "Planned or designed for a specific purpose."],
          ["Imagine", "To form a picture or idea in your mind."],
          ["Calculate", "To find an answer using mathematics."],
          ["Vision", "A clear idea of what the future could be."]
        ]
      },
      {
        country: "France",
        woman: "Marie Curie",
        coords: [48.8566, 2.3522],
        story: "Marie Curie was the first woman to win a Nobel Prize and the only person to win Nobel Prizes in two different sciences. She discovered radium and polonium and transformed modern medicine. Her disciplined research saved countless lives.",
        quote: "Nothing in life is to be feared, it is only to be understood.",
        vocab: [
          ["Discover", "To find something for the first time."],
          ["Transformed", "Changed completely in a significant way."],
          ["Disciplined", "Showing control, focus, and consistent effort."],
          ["Research", "Careful study to learn new facts or ideas."],
          ["Countless", "Too many to count."]
        ]
      },
      {
        country: "Kenya",
        woman: "Wangari Maathai",
        coords: [-1.2864, 36.8172],
        story: "Wangari Maathai founded the Green Belt Movement and helped women plant millions of trees across Kenya. She connected environmental care with human rights and community leadership. She became the first African woman to receive the Nobel Peace Prize.",
        quote: "It's the little things citizens do. That's what will make the difference.",
        vocab: [
          ["Founded", "Started an organization or movement."],
          ["Environmental", "Related to the natural world and nature."],
          ["Community", "A group of people living or working together."],
          ["Leadership", "The ability to guide and motivate others."],
          ["Citizens", "People who legally belong to a country."]
        ]
      },
      {
        country: "India",
        woman: "Kalpana Chawla",
        coords: [28.6139, 77.2090],
        story: "Kalpana Chawla was the first woman of Indian origin in space. She studied hard, became an aerospace engineer, and later joined NASA as an astronaut. Her journey encourages students to dream beyond borders.",
        quote: "The path from dreams to success does exist.",
        vocab: [
          ["Origin", "A person's background or where they come from."],
          ["Aerospace", "Related to aircraft and spacecraft."],
          ["Astronaut", "A person trained to travel in space."],
          ["Journey", "An experience that involves progress over time."],
          ["Borders", "Lines that divide one country from another."]
        ]
      },
      {
        country: "Brazil",
        woman: "Marta Vieira da Silva",
        coords: [-15.7801, -47.9292],
        story: "Marta became one of the greatest football players in history and a global advocate for women in sport. She rose from a small town to international success through persistence and discipline. Her career proves talent can grow anywhere with opportunity.",
        quote: "Believe in yourself and fight every day for your dream.",
        vocab: [
          ["Advocate", "A person who publicly supports a cause."],
          ["Persistence", "Continuing firmly even when something is difficult."],
          ["Discipline", "Training yourself to work hard and stay focused."],
          ["Career", "The work a person does over many years."],
          ["Opportunity", "A good chance to do something."]
        ]
      }
    ];

    const panel = document.getElementById("detailsPanel");

    const map = L.map("map", {
      zoomControl: true,
      worldCopyJump: true
    }).setView([21, 8], 2.1);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      subdomains: "abcd",
      maxZoom: 19
    }).addTo(map);

    function renderPanel(entry) {
      const vocabItems = entry.vocab
        .map(([word, meaning]) => `<li><span class=\"vocab-word\">${word}:</span> ${meaning}</li>`)
        .join("");

      panel.innerHTML = `
        <span class="country-badge">${entry.country}</span>
        <h2 class="name">${entry.woman}</h2>
        <p class="story">${entry.story}</p>
        <p class="quote">“${entry.quote}”</p>
        <h3 class="vocab-title">Vocabulary Boost</h3>
        <ul class="vocab-list">${vocabItems}</ul>
      `;
    }

    countryStories.forEach((entry) => {
      const marker = L.circleMarker(entry.coords, {
        radius: 8,
        color: "#7c4e94",
        weight: 2,
        fillColor: "#bd8dd3",
        fillOpacity: 0.86
      }).addTo(map);

      marker.bindPopup(`
        <div>
          <p class="mini-title">${entry.country}</p>
          <p class="mini-text"><strong>${entry.woman}</strong><br/>Click to view her story and vocabulary.</p>
        </div>
      `);

      marker.on("click", () => renderPanel(entry));
    });
  </script>
</body>
</html>
